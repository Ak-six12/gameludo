server.port=8080
spring.datasource.url=jdbc:h2:file:./data/ludo;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jackson.serialization.write-dates-as-timestamps=false

# Authentication
spring.sql.init.mode=always
auth.otp.expiry-minutes=5
# Development only: prints OTP in backend console. Change to a real SMS provider before production.
auth.sms.provider=console
# Google OAuth Web Client ID from Google Cloud Console
google.client-id=YOUR_GOOGLE_WEB_CLIENT_ID.apps.googleusercontent.com
